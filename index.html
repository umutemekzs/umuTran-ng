<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="description" content="umuTraning kişisel antrenman takip uygulaması">
<link rel="manifest" href="manifest.webmanifest">
<title>umuTraning</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#151518;--panel2:#202024;--red:#e11d2e;--muted:#a1a1aa;--line:#303036;--text:#f5f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;background:linear-gradient(145deg,#23080c,#0c0c0e 70%);border-bottom:1px solid #351217;position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:900;letter-spacing:-.8px}.brand span{color:var(--red)}.sub{font-size:12px;color:var(--muted);margin-top:4px}
main{padding:16px;max-width:760px;margin:auto}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#111114;border-top:1px solid var(--line);padding:9px 4px calc(9px + env(safe-area-inset-bottom))}
.tabs button{background:none;color:#aaa;border:0;font-size:11px;padding:5px 4px;display:flex;flex-direction:column;gap:4px;align-items:center;flex:1}.tabs button b{font-size:19px;font-weight:500}.tabs button.active{color:var(--red)}
h1{font-size:24px;margin:6px 0 14px}h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(130deg,#301015,#171215 60%,#151518);border-color:#56202a}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#351015;color:#ff9aa3;border:1px solid #68202a;border-radius:99px;padding:5px 9px;font-size:11px}.btn{border:0;border-radius:11px;padding:12px 14px;background:var(--red);color:white;font-weight:750;font-size:14px}.btn.secondary{background:#29292e;border:1px solid #414148}.btn.small{padding:8px 10px}.btn:active{opacity:.75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#101013;border-radius:12px;padding:12px}.stat strong{display:block;font-size:23px;margin-top:4px}.exercise{padding:13px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.exercise-title{font-weight:750}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.inputs label{font-size:11px;color:var(--muted)}input,select{width:100%;background:#0d0d10;color:white;border:1px solid #3c3c44;border-radius:9px;padding:10px;margin-top:4px;font-size:15px;min-width:0}.checkrow{display:flex;gap:8px;align-items:center;margin-top:9px;color:#ddd;font-size:13px}.checkrow input{width:18px;height:18px;margin:0;accent-color:var(--red)}.warning{border-color:#7c2930;background:#260d11}.warning h2{color:#ff8993}.hide{display:none!important}.chart{height:180px;width:100%;display:block}.barrow{display:grid;grid-template-columns:80px 1fr 45px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.barbg{height:9px;background:#303036;border-radius:8px;overflow:hidden}.bar{height:100%;background:var(--red);border-radius:8px}.timer{font-size:52px;font-weight:850;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}.empty{padding:25px;text-align:center;color:var(--muted)}footer{font-size:11px;color:var(--muted);text-align:center;padding:12px}
</style>
</head>
<body>
<header><div class="brand">umu<span>Traning</span></div><div class="sub">Antrenmanını takip et. İlerlemeyi gör.</div></header>
<main id="app"></main>
<nav class="tabs">
<button class="active" data-tab="home"><b>⌂</b>Program</button>
<button data-tab="workout"><b>＋</b>Antrenman</button>
<button data-tab="history"><b>▤</b>Geçmiş</button>
<button data-tab="progress"><b>↗</b>Gelişim</button>
<button data-tab="settings"><b>⚙</b>Ayarlar</button>
</nav>
<script>
const plans=[
{name:"1. Gün · Üst Vücut A",focus:"Göğüs, sırt, omuz, kol",ex:[
["Incline dumbbell press","3","8–12"],["Chest-supported row","3","8–12"],["Lat pulldown","3","8–12"],["Chest press","3","8–12"],["Lateral raise","4","12–20"],["Rope triceps pushdown","3","10–15"],["Dumbbell curl","3","10–15"]]},
{name:"2. Gün · Alt Vücut A",focus:"Arka zincir, kalça, core",ex:[
["Romanian deadlift","3","8–10"],["Hip thrust","3","8–12"],["Seated leg curl","3","10–15"],["Leg extension*","2","12–15"],["Standing calf raise","4","10–15"],["Dead bug","3","10/yan"]]},
{name:"3. Gün · Üst Vücut B",focus:"Göğüs, sırt, omuz, kol",ex:[
["Incline chest press","3","8–12"],["Tek kol cable lat pulldown","3","10–12/yan"],["Seated cable row","3","8–12"],["Seated dumbbell shoulder press","3","8–12"],["Reverse pec deck","3","12–20"],["Preacher curl","3","10–12"],["Overhead rope triceps extension","3","10–15"],["Tek kol cable lateral raise","2","12–20/yan"]]},
{name:"4. Gün · Alt Vücut B",focus:"Kalça, arka bacak, core",ex:[
["Hip thrust","3","10–12"],["Romanian deadlift","3","8–12"],["Seated leg curl","3","10–15"],["Destekli alçak step-up*","2","8/bacak"],["Seated calf raise","4","12–20"],["Pallof press","3","10–12/yan"]]}
];
const key="umuTraningDataV1";
let data=load(),tab="home",activeDay=0,timer=null,remaining=90;
function load(){try{return JSON.parse(localStorage.getItem(key))||{sessions:[],bodyweights:[],draft:{}}}catch(e){return {sessions:[],bodyweights:[],draft:{}}}}
function save(){localStorage.setItem(key,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(d){return new Date(d).toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"})}
function setTab(t){tab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function render(){const a=document.getElementById("app"); if(tab==="home")a.innerHTML=home();if(tab==="workout")a.innerHTML=workout();if(tab==="history")a.innerHTML=history();if(tab==="progress")a.innerHTML=progress();if(tab==="settings")a.innerHTML=settings();wire()}
function home(){let last=data.sessions[0];return `<section class="card hero"><div class="row"><span class="pill">4 GÜNLÜK PROGRAM</span><span class="muted">SİYAH × KIRMIZI</span></div><h1>Bugün kendin için çalış.</h1><p class="muted">Setlerini kaydet, dinlenmeni yönet, gelişimini takip et.</p><div class="grid"><div class="stat"><span class="muted">Antrenman sayısı</span><strong>${data.sessions.length}</strong></div><div class="stat"><span class="muted">Son antrenman</span><strong style="font-size:16px">${last?fmtDate(last.date):"Henüz yok"}</strong></div></div><p style="margin-bottom:0"><button class="btn" data-go="workout">Antrenmana başla →</button></p></section><section class="card warning"><h2>⚠ Diz güvenliği</h2><div class="muted">Ön çapraz bağ / menisküs ameliyatı sonrası egzersiz seçimi, hareket açısı ve yük için fizyoterapistinin planını esas al. * İşaretli hareketleri yalnızca uzman onayladıysa yap. Ağrı, artan şişlik, kilitlenme veya boşalma hissinde dur ve sağlık uzmanına danış.</div></section><h2>Programın</h2>${plans.map((p,i)=>`<section class="card"><div class="row"><div><strong>${p.name}</strong><div class="muted" style="margin-top:5px">${p.focus}</div></div><button class="btn secondary small" data-day="${i}">Aç</button></div><div class="muted" style="margin-top:10px">${p.ex.length} hareket · yaklaşık 60–90 dk</div></section>`).join("")}<footer>Kayıtların bu cihazın tarayıcısında saklanır.</footer>`}
function workout(){return `<h1>Antrenman kaydı</h1><div class="card"><label>Program günü<select id="daySelect">${plans.map((p,i)=>`<option value="${i}" ${activeDay===i?"selected":""}>${p.name}</option>`).join("")}</select></label><p class="muted">Her hareket için set, tekrar ve ağırlık bilgilerini gir. Bitirince kaydet.</p></div><div class="card warning"><strong>Diz kontrolü</strong><div class="muted">Ağrı veya şişlik artıyorsa egzersizi sürdürme. Rehabilitasyon planına uy.</div></div><div class="card">${plans[activeDay].ex.map((e,i)=>`<div class="exercise"><div class="row"><div><div class="exercise-title">${esc(e[0])}</div><div class="muted">Hedef: ${e[1]} set · ${e[2]} tekrar</div></div><span class="pill">${i+1}/${plans[activeDay].ex.length}</span></div><div class="inputs"><label>Set<input type="number" min="0" max="20" value="${e[1]}" data-ex="${i}" data-field="sets"></label><label>Tekrar<input type="text" value="${e[2]}" data-ex="${i}" data-field="reps"></label><label>Kg<input type="number" min="0" step="0.5" placeholder="0" data-ex="${i}" data-field="kg"></label></div><label class="checkrow"><input type="checkbox" data-ex="${i}" data-field="done"> Hareket tamamlandı</label></div>`).join("")}</div><div class="card"><h2>Dinlenme sayacı</h2><div class="timer" id="timer">${clock(remaining)}</div><div class="row"><button class="btn" id="timerStart">90 sn başlat</button><button class="btn secondary" id="timerReset">Sıfırla</button></div><div class="muted" style="margin-top:8px">Süre dolunca telefonun ses ayarlarına bağlı olarak bildirim/ses garantisi yoktur.</div></div><button class="btn" id="saveWorkout" style="width:100%">Antrenmanı kaydet</button><footer>Kaydedilen antrenmanlar Geçmiş sekmesinde görünür.</footer>`}
function clock(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function history(){if(!data.sessions.length)return `<h1>Antrenman geçmişi</h1><div class="card empty">Henüz kayıt yok. İlk antrenmanını kaydedince burada görünecek.</div>`;return `<h1>Antrenman geçmişi</h1>${data.sessions.map((s,i)=>`<section class="card"><div class="row"><strong>${esc(s.name)}</strong><span class="pill">${fmtDate(s.date)}</span></div><div class="muted" style="margin:8px 0">${s.completed} hareket tamamlandı · ${s.volume.toLocaleString("tr-TR")} kg toplam hacim</div><details><summary>Detayları göster</summary>${s.exercises.map(e=>`<div class="exercise"><strong>${esc(e.name)}</strong><div class="muted">${e.done?"Tamamlandı":"Tamamlanmadı"} · ${esc(e.sets)} set × ${esc(e.reps)} tekrar · ${esc(e.kg||0)} kg</div></div>`).join("")}</details><p style="text-align:right;margin-bottom:0"><button class="btn secondary small" data-delete="${i}">Kaydı sil</button></p></section>`).join("")}`}
function progress(){let sessions=[...data.sessions].reverse();let max=Math.max(1,...sessions.map(s=>s.volume));return `<h1>Gelişim</h1><section class="card"><h2>Antrenman hacmi</h2><div class="muted">Set ağırlıklarının × set × tekrar toplamı. Yalnızca kayıtlı değerlerden hesaplanır.</div>${sessions.length?sessions.slice(-8).map(s=>`<div class="barrow"><span>${fmtDate(s.date).replace(/\s\d{4}$/,"")}</span><div class="barbg"><div class="bar" style="width:${Math.max(2,s.volume/max*100)}%"></div></div><span>${Math.round(s.volume)}</span></div>`).join(""):`<div class="empty">Grafik için önce antrenman kaydet.</div>`}</section><section class="card"><h2>Vücut ağırlığı</h2><form id="weightForm"><label>Kilo (kg)<input id="weightInput" type="number" step="0.1" min="20" max="350" placeholder="Örn. 72.5" required></label><p><button class="btn">Kilo kaydet</button></p></form>${data.bodyweights.length?data.bodyweights.slice().reverse().map(w=>`<div class="row exercise"><span>${fmtDate(w.date)}</span><strong>${w.kg} kg</strong></div>`).join(""):`<div class="muted">Henüz kilo kaydı yok.</div>`}</section>`}
function settings(){return `<h1>Ayarlar</h1><section class="card"><h2>Verilerin</h2><p class="muted">Veriler bu cihazdaki tarayıcıda saklanır. Tarayıcı verilerini temizlersen kayıtlar silinebilir. Yedek almak için dışa aktar.</p><div class="row"><button class="btn" id="exportData">Yedeği indir</button><label class="btn secondary" for="importFile" style="display:inline-block;cursor:pointer">Yedek yükle</label><input id="importFile" type="file" accept="application/json" class="hide"></div></section><section class="card"><h2>Güvenlik notu</h2><p class="muted">Bu uygulama tıbbi değerlendirme veya fizyoterapi planının yerine geçmez. Ameliyat sonrası yük ve hareket sınırlarını sağlık ekibin belirlemeli.</p></section><section class="card"><h2>Program</h2><p class="muted">4 günlük orta seviye plan. Dinlenme günlerini haftaya yay; tüm alt vücut hareketlerini yalnızca dizin hazır ve uzman onaylıysa uygula.</p></section>`}
function wire(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setTab(b.dataset.go));document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{activeDay=+b.dataset.day;setTab("workout")});const ds=document.getElementById("daySelect");if(ds)ds.onchange=()=>{activeDay=+ds.value;render()};const st=document.getElementById("timerStart");if(st)st.onclick=()=>{if(timer){clearInterval(timer);timer=null;st.textContent="Devam et";return}st.textContent="Duraklat";timer=setInterval(()=>{remaining=Math.max(0,remaining-1);const el=document.getElementById("timer");if(el)el.textContent=clock(remaining);if(remaining===0){clearInterval(timer);timer=null;const b=document.getElementById("timerStart");if(b)b.textContent="Yeniden başlat";if(navigator.vibrate)navigator.vibrate([250,100,250])}},1000)};const tr=document.getElementById("timerReset");if(tr)tr.onclick=()=>{clearInterval(timer);timer=null;remaining=90;const el=document.getElementById("timer");if(el)el.textContent=clock(remaining);const b=document.getElementById("timerStart");if(b)b.textContent="90 sn başlat"};const sw=document.getElementById("saveWorkout");if(sw)sw.onclick=()=>{const ex=plans[activeDay].ex.map((e,i)=>{const val=f=>document.querySelector(`[data-ex="${i}"][data-field="${f}"]`);return {name:e[0],sets:val("sets")?.value||e[1],reps:val("reps")?.value||e[2],kg:Number(val("kg")?.value||0),done:!!val("done")?.checked}});let volume=ex.reduce((sum,e)=>sum+(Number(e.sets)||0)*(Number(e.reps)||0)*(Number(e.kg)||0),0);data.sessions.unshift({name:plans[activeDay].name,date:new Date().toISOString(),exercises:ex,completed:ex.filter(e=>e.done).length,volume:Math.round(volume)});save();setTab("history")};document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Bu antrenman kaydı silinsin mi?")){data.sessions.splice(+b.dataset.delete,1);save();render()}});const wf=document.getElementById("weightForm");if(wf)wf.onsubmit=e=>{e.preventDefault();data.bodyweights.push({date:new Date().toISOString(),kg:Number(document.getElementById("weightInput").value)});save();render()};const ex=document.getElementById("exportData");if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="umuTraning-yedek.json";a.click();URL.revokeObjectURL(url)};const im=document.getElementById("importFile");if(im)im.onchange=async()=>{try{const parsed=JSON.parse(await im.files[0].text());if(!Array.isArray(parsed.sessions)||!Array.isArray(parsed.bodyweights))throw Error();data=parsed;save();render();alert("Yedek yüklendi.")}catch(e){alert("Yedek dosyası okunamadı.")}}}
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
render();
</script>
</body>
</html>
